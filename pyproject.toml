[project]
name = "gemini-epub-translator-en-id"
version = "2.4.1"
description = "Local EPUB-preserving English to Indonesian translator"
requires-python = ">=3.11,<3.15"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
